<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Morel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden;background:#f7f5f0;font-family:'Inter',-apple-system,sans-serif}
    #map{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
    .zi-panel{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e1d8;padding:14px 16px 20px;transform:translateY(100%);transition:transform 0.25s;z-index:1000;max-height:55%;overflow-y:auto}
    .zi-panel.visible{transform:translateY(0)}
    .zi-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280}
    .zi-name{font-size:16px;font-weight:700;color:#1f2421;margin-bottom:4px;padding-right:30px}
    .zi-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:10px}
    .zi-badge.high{background:#d1fae5;color:#065f46}
    .zi-badge.med{background:#fef3c7;color:#92400e}
    .zi-badge.low{background:#fee2e2;color:#991b1b}
    .zi-row{font-size:13px;color:#374151;margin-bottom:4px}
    .zi-note{font-size:12px;color:#6b7280;margin-top:6px;font-style:italic}
    .hmatch{display:inline-block;background:#edf7f1;color:#2d6a4f;padding:2px 8px;border-radius:99px;font-size:11px;margin:2px}
    .zoom-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.92);border:1px solid #e4e1d8;border-radius:12px;padding:16px 22px;font-size:14px;color:#555;text-align:center;pointer-events:none;z-index:500;backdrop-filter:blur(4px);white-space:nowrap}
    .elev-pill{display:inline-block;font-size:11px;background:#f3f4f6;color:#6b7280;padding:2px 8px;border-radius:99px;margin-left:8px;font-weight:400}
    .hab-matches{margin-top:6px}
  </style>
</head>
<body>
<div id="map"></div>
<div class="zi-panel" id="zone-info">
  <button class="zi-close" id="close-zi">×</button>
  <div class="zi-name" id="zi-name">—</div>
  <span class="zi-badge" id="zi-badge">—</span>
  <div class="zi-row"><strong>Region:</strong> <span id="zi-region">—</span></div>
  <div class="zi-row"><strong>Trees:</strong> <span id="zi-trees">—</span></div>
  <div class="zi-row"><strong>Terrain:</strong> <span id="zi-topo">—</span></div>
  <div class="zi-note" id="zi-note"></div>
  <div class="hab-matches" id="zi-hab-matches"></div>
</div>

function getElevBand(lat,lng){
  if(lng<-104) return lat>44?"high":"mid";
  if(lng>-83&&lng<-77&&lat>35&&lat<40) return "mid";
  if(lng>-94.6&&lng<-89.4&&lat>36.4&&lat<38.7) return "mid";
  if(lat>34.9&&lat<39.6&&lng>-82.6&&lng<-77.4) return "mid";
  return "low";
}

function generateGridSpots(){
  var spots=[];
  var STEP=0.06;
  var s=7919;
  function lcg(){s=(s*1664525+1013904223)>>>0; return s/4294967295;}
  for(var lat=28.5;lat<=49.5;lat+=STEP){
    for(var lng=-124.5;lng<=-66.5;lng+=STEP){
      var q=regionQuality(lat,lng);
      if(q<0.16){lcg();lcg();lcg();continue;}
      spots.push({
        name:gn(lcg),
        lat:+(lat+(lcg()-0.5)*STEP*0.7).toFixed(4),
        lng:+(lng+(lcg()-0.5)*STEP*0.7).toFixed(4),
        base:Math.round(q*62+26),
        elev:getElevBand(lat,lng),
        rk:getRegionKey(lat,lng),
        notes:""
      });
    }
  }
  return spots;
}

const GENERATED=generateGridSpots();
const ALL=CURATED.concat(GENERATED);
document.getElementById("hcount").textContent=ALL.length.toLocaleString()+" spots";

const SEL={early:{low:14,mid:2,high:-20},peak:{low:2,mid:9,high:-4},late:{low:-16,mid:5,high:18}};
const SF={early:0.76,peak:1.0,late:0.82};
const HB=[0,6,14];
var season="peak";
var hab={ss:false,wl:false,w:false,o:false};
function visible(s){var anyOn=hab.ss||hab.wl||hab.w||hab.o;if(!anyOn)return true;var h=(RP[s.rk]||["","", [0,0,0,0]])[2];if(hab.ss&&(h[0]||0)<1)return false;if(hab.wl&&(h[1]||0)<1)return false;if(hab.w&&(h[2]||0)<1)return false;if(hab.o&&(h[3]||0)<1)return false;return true;}
function scoreSpot(s){var rp=RP[s.rk]||["","", [0,0,0,0]];var h=rp[2];var v=s.base;v+=(SEL[season][s.elev]||0);v*=SF[season];var rain=parseFloat(document.getElementById("rain").value);var rf=(rain>=0.5&&rain<=2.5)?1.0:(rain>=0.2)?0.85:(rain>2.5)?0.75:0.50;v*=tf*rf;if(hab.ss)v+=HB[h[0]||0];if(hab.wl)v+=HB[h[1]||0];if(hab.w)v+=HB[h[2]||0];if(hab.o)v+=HB[h[3]||0];return Math.round(Math.min(99,Math.max(5,v)));}
function scoreCol(sc){return sc>=70?"#1b7a56":sc>=40?"#d97706":"#dc2626";}
function elevCol(e){return e==="high"?"#8b5cf6":e==="mid"?"#3b82f6":"#22c55e";}

var osmLayer=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19});
var topoLayer=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{attribution:'&copy; <a href="https://opentopomap.org">OpenTopoMap</a>',maxZoom:17});
var map=L.map("map",{layers:[osmLayer]}).setView([38.5,-92],5);
L.control.layers({"Streets":osmLayer,"Terrain + Contours":topoLayer},{},{position:"topright"}).addTo(map);
var renderer=L.canvas({padding:0.5});
var layers=[];

// Zoom hint overlay — inserted after DOM ready
var zoomHint=document.createElement("div");
zoomHint.id="zoom-hint";
zoomHint.style.cssText="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.92);border:1px solid #e4e1d8;border-radius:12px;padding:16px 22px;font-size:14px;color:#555;font-family:inherit;text-align:center;pointer-events:none;z-index:500;backdrop-filter:blur(4px);white-space:nowrap;";
zoomHint.innerHTML="🍄 <strong style='color:#2d6a4f'>Zoom in</strong> to reveal habitat spots<br><span style='font-size:12px;color:#aaa'>Scroll or pinch to zoom into any region</span>";
var mapEl=document.getElementById("map");
if(mapEl){ mapEl.style.position="relative"; mapEl.appendChild(zoomHint); }

var MIN_ZOOM = 9; // dots only appear at zoom 9+

function render(){
  layers.forEach(function(l){map.removeLayer(l);});
  layers=[];

  var zoom=map.getZoom();

  // Below threshold — show hint, no dots
  if(zoom < MIN_ZOOM){
    zoomHint.style.display="block";
    return;
  }
  zoomHint.style.display="none";

  // Only render spots inside the current viewport (+ 15% buffer)
  var bounds=map.getBounds().pad(0.15);

  ALL.forEach(function(s){
    // Viewport cull first — fast
    if(!bounds.contains(L.latLng(s.lat,s.lng))) return;
    // Habitat toggle filter — disappear completely if no match
    if(!visible(s)) return;

    var sc=scoreSpot(s),fc=scoreCol(sc),ec=elevCol(s.elev),r=sc>=70?9:sc>=40?7:6;
    if(sc>=74){
      var g=L.circleMarker([s.lat,s.lng],{renderer:renderer,radius:r+7,weight:0,fillColor:fc,fillOpacity:0.14,interactive:false});
      g.addTo(map);layers.push(g);
    }
    var ring=L.circleMarker([s.lat,s.lng],{renderer:renderer,radius:r+2.5,weight:1.8,color:ec,opacity:0.65,fillOpacity:0,interactive:false});
    ring.addTo(map);layers.push(ring);
    var dot=L.circleMarker([s.lat,s.lng],{renderer:renderer,radius:r,weight:1.5,color:"#fff",opacity:0.85,fillColor:fc,fillOpacity:0.90});
    dot.on("click",function(){showSpotInfo(s);});
    dot.addTo(map);layers.push(dot);
  });
}

// Re-render whenever map moves or zooms
map.on("moveend zoomend", debouncedRender);
function showSpotInfo(s){
  var sc=scoreSpot(s),cls=sc>=70?"high":sc>=40?"med":"low",lbl=sc>=70?"High likelihood":sc>=40?"Moderate":"Low likelihood";
  var et={low:"Lowlands",mid:"Mid-elevation",high:"High elevation"}[s.elev];
  var rp=RP[s.rk]||["Unknown","Unknown",[0,0,0,0]];
  document.getElementById("zi-name").innerHTML=s.name+'<span class="elev-pill">'+et+'</span>';
  var b=document.getElementById("zi-badge");b.textContent=sc+"% — "+lbl;b.className="zi-badge "+cls;
  document.getElementById("zi-region").textContent=s.rk||"—";document.getElementById("zi-trees").textContent=rp[0];document.getElementById("zi-topo").textContent=rp[1];document.getElementById("zi-note").textContent=s.notes||"";
  var me=document.getElementById("zi-hab-matches");me.innerHTML="";
  var hLabels={ss:"South-facing slope",wl:"Wood line",w:"Water nearby",o:"Oak trees"};var hKeys=["ss","wl","w","o"];
  rp[2].forEach(function(v,i){if(v>=1){var c=document.createElement("span");c.className="hmatch";c.textContent=(v===2?"★ ":"")+hLabels[hKeys[i]];me.appendChild(c);}});
  document.getElementById("zone-info").classList.add("visible");
  document.getElementById("zone-info").scrollIntoView({behavior:"smooth",block:"nearest"});
}
document.getElementById("close-zi").addEventListener("click",function(){document.getElementById("zone-info").classList.remove("visible");});
var debounce=null;
function debouncedRender(){clearTimeout(debounce);debounce=setTimeout(render,80);}
document.getElementById("rain").addEventListener("input",function(){document.getElementById("rain-val").textContent=parseFloat(this.value).toFixed(1)+"\"";debouncedRender();});
document.querySelectorAll(".sbtn").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll(".sbtn").forEach(function(b){b.classList.remove("active");});this.classList.add("active");season=this.dataset.s;render();});});
document.querySelectorAll(".hab-toggle").forEach(function(el){el.addEventListener("click",function(){var k=this.dataset.hab;hab[k]=!hab[k];this.classList.toggle("active",hab[k]);render();});});

render();
updateAuthUI();
initAds();

// Ensure map renders correctly after full page load
window.addEventListener("load", function(){
  setTimeout(function(){ if(map){ map.invalidateSize(); render(); } }, 200);
});
window.addEventListener("resize", function(){
  if(map) map.invalidateSize();
});
// Override showSpotInfo to use our panel
function showSpotInfo(s){
  var sc=scoreSpot(s),cls=sc>=70?"high":sc>=40?"med":"low",lbl=sc>=70?"High likelihood":sc>=40?"Moderate":"Low likelihood";
  var et={low:"Lowlands",mid:"Mid-elevation",high:"High elevation"}[s.elev];
  var rp=RP[s.rk]||["Unknown","Unknown",[0,0,0,0]];
  document.getElementById("zi-name").innerHTML=s.name+'<span class="elev-pill">'+et+'</span>';
  var b=document.getElementById("zi-badge");b.textContent=sc+"% — "+lbl;b.className="zi-badge "+cls;
  document.getElementById("zi-region").textContent=s.rk||"—";
  document.getElementById("zi-trees").textContent=rp[0];
  document.getElementById("zi-topo").textContent=rp[1];
  document.getElementById("zi-note").textContent=s.notes||"";
  var me=document.getElementById("zi-hab-matches");me.innerHTML="";
  var hLabels={ss:"South-facing slope",wl:"Wood line",w:"Water nearby",o:"Oak trees"};
  var hKeys=["ss","wl","w","o"];
  rp[2].forEach(function(v,i){if(v>=1){var c=document.createElement("span");c.className="hmatch";c.textContent=(v===2?"★ ":"")+hLabels[hKeys[i]];me.appendChild(c);}});
  document.getElementById("zone-info").classList.add("visible");
}
document.getElementById("close-zi").addEventListener("click",function(){
  document.getElementById("zone-info").classList.remove("visible");
});

// Zoom hint
var zh=document.createElement("div");zh.className="zoom-hint";zh.id="zoom-hint";
zh.innerHTML="🍄 <strong style='color:#2d6a4f'>Zoom in</strong> to reveal spots<br><span style='font-size:12px;color:#aaa'>Pinch or scroll to zoom</span>";
document.getElementById("map").appendChild(zh);

window.addEventListener("resize",function(){ if(map) map.invalidateSize(); });
window.addEventListener("load",function(){ setTimeout(function(){ map.invalidateSize(); render(); },200); });
</script>
